name: GlobeSecure Lockfile Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lockfile-bootstrap.yml'

permissions:
  contents: write

jobs:
  pin-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve npm lock without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate lock metadata
        run: |
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(l.lockfileVersion!==3||JSON.stringify(Object.entries(p.dependencies).sort())!==JSON.stringify(Object.entries(l.packages[""].dependencies).sort()))process.exit(1)'
      - name: Commit pinned lockfile to main without force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: pin production dependencies in npm lockfile"
          git fetch origin main
          git rebase origin/main
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:main
