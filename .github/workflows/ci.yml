name: GlobeSecure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve dependency lock for reproducibility
        uses: actions/upload-artifact@v4
        with:
          name: globesecure-lock-candidate
          path: package-lock.json
          retention-days: 7
      - name: Unit tests
        run: npm run test
      - name: Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://globesecure.ca
          GLOBESECURE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Assemble standalone artifact
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/
          if [ -d public ]; then cp -R public .next/standalone/; fi
          test -f .next/standalone/server.js
      - name: Smoke-test the built HTTP service
        run: |
          PORT=3077 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3077/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3077/ > /dev/null
          curl -fsS http://127.0.0.1:3077/services/evenementiel > /dev/null
          curl -fsS http://127.0.0.1:3077/api/health | node -e 'const wanted=process.env.GITHUB_SHA; let json="";process.stdin.on("data",x=>json+=x).on("end",()=>{if(JSON.parse(json).release!==wanted){console.error("Build SHA does not match",wanted);process.exit(1)}})'
      - uses: actions/upload-artifact@v4
        with:
          name: globesecure-standalone
          path: .next/standalone/
          include-hidden-files: true
          retention-days: 7
