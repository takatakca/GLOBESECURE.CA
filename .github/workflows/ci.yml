name: GlobeSecure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: globesecure_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d globesecure_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm run test
      - name: Next.js production build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: https://globesecure.ca
          GLOBESECURE_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Assemble standalone artifact
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/
          if [ -d public ]; then cp -R public .next/standalone/; fi
          test -f .next/standalone/server.js
      - name: Smoke-test the built HTTP service
        run: |
          PORT=3077 HOSTNAME=127.0.0.1 node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:3077/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3077/ > /dev/null
          curl -fsS http://127.0.0.1:3077/services/evenementiel > /dev/null
          EXPECTED_SHA="$GITHUB_SHA" node scripts/smoke-http.mjs
          curl -fsS http://127.0.0.1:3077/api/health | node -e 'const wanted=process.env.GITHUB_SHA; let json="";process.stdin.on("data",x=>json+=x).on("end",()=>{if(JSON.parse(json).release!==wanted){console.error("Build SHA does not match",wanted);process.exit(1)}})'
      - name: PostgreSQL and authenticated multi-tenant API integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/globesecure_test
          GLOBESECURE_ALLOW_TEST_DB: 'true'
          NEXT_PUBLIC_SITE_URL: https://globesecure.ca
          TAKATAK_OIDC_ISSUER: https://oidc.integration.invalid
          TAKATAK_OIDC_CLIENT_ID: globesecure-ci
          SESSION_SECRET: ci-test-not-for-production-01234567890123456789
        run: node scripts/integration-assignments.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: globesecure-standalone
          path: .next/standalone/
          include-hidden-files: true
          retention-days: 7
